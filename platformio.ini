; PlatformIO project for the ESP32 "Cheap Yellow Display" (ESP32-2432S028R)
; Shows the next Auckland bin collection fetched from an aklapi server.

[env:cyd]
; Pinned to the Arduino-ESP32 2.x platform: TFT_eSPI is not fully happy with 3.x yet.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

; TFT_eSPI is normally configured by editing User_Setup.h inside the library.
; Instead we configure it here, so the project is self-contained.
build_flags =
    -D USER_SETUP_LOADED=1
    ; --- Display driver (most CYD boards = ILI9341) ---
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; --- CYD display wiring (HSPI) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; If colours look inverted (white background is black), uncomment:
    ; -D TFT_INVERSION_ON=1
    ; If red and blue are swapped, uncomment:
    ; -D TFT_RGB_ORDER=TFT_BGR
